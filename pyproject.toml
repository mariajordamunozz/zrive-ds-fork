[tool.poetry]
name = "zrive-ds"
version = "0.1.0"
description = "Project for the program Zrive Applied Data Science"
authors = ["Guille Barquero <gb@zriveapp.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.0.3"
matplotlib = "^3.7.2"
numpy = "^1.25.2"
requests = "^2.31.0"
scikit-learn = "1.3.1"
openmeteo-requests = "^1.7.5"
requests-cache = "^1.3.0"
retry-requests = "^2.0.0"
ipykernel = "^7.2.0"
pyarrow = "^23.0.1"
seaborn = "^0.13.2"
statsmodels = "^0.14.6"
nbconvert = "^7.17.0"
fastapi = ">=0.110,<1.0"
uvicorn = { version = ">=0.27,<1.0", extras = ["standard"] }
pydantic = ">=2.5,<3.0"
joblib = ">=1.3"

[tool.poetry.group.dev.dependencies]
black = "^23.7.0"
flake8 = "^6.1.0"
mypy = "^1.5.1"
pytest = "^7.4.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
